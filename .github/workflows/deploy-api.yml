name: Deploy API

# The Function App behind /api/*. Deploys only when the API changes — the site
# is untouched by anything that happens here.
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: api-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    environment:
      name: production
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Prune to production dependencies
        run: npm prune --omit=dev

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to the Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: api
          respect-funcignore: true

      - name: Smoke test
        run: |
          set -euo pipefail
          url="https://${{ vars.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/health"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "healthy: $(cat /tmp/health.json)"
              exit 0
            fi
            echo "attempt $attempt returned $code; the app may still be starting"
            sleep 10
          done
          echo "The API never answered /api/health after deployment." >&2
          cat /tmp/health.json >&2 || true
          exit 1
