name: CI

# Every PR is typechecked and built the same way the deploy does it, so a merge
# to main never fails at the deploy step.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # paths-filter lists a PR's files through the API, which needs this.
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - 'components/**'
              - 'lib/**'
              - 'public/**'
              - 'proxy.ts'
              - 'next.config.mjs'
              - 'tsconfig.json'
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile'
            infra:
              - 'infra/**'

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node .github/scripts/issue-to-import.cjs
      - run: node scripts/check-request-issue.mjs
      - run: npm run build

      # `next build` happily compiles route trees that crash at runtime - two
      # different slug names on one path segment, for instance. Booting the
      # image is the only thing that catches those.
      - name: Build the image
        run: docker build -t wtla:ci .

      - name: Boot it and check the routes
        run: |
          set -euo pipefail
          # AUTH_PROVIDER as Bicep sets it; unset, the admin gate answers 503 not 401.
          docker run -d --name wtla-ci -p 3888:3000 \
            -e AUTH_PROVIDER=aad \
            -e COSMOS_ENDPOINT=https://unreachable.documents.azure.com:443/ \
            -e COSMOS_DATABASE=wtla wtla:ci
          for _ in $(seq 1 20); do
            curl -sf http://localhost:3888/api/live >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3888/api/live >/dev/null

          admin=$(printf '%s' '{"auth_typ":"aad","claims":[{"typ":"oid","val":"ci"},{"typ":"roles","val":"admin"}]}' | base64 -w0)
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3888/api/admin/vendors)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "x-ms-client-principal: $admin" http://localhost:3888/api/me)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3888/privacy)" = "200"
          # tools/list never touches the store, so it proves the MCP route boots.
          tools=$(curl -sf -X POST -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' http://localhost:3888/api/mcp)
          grep -q search_log_locations <<<"$tools"

          # The store is deliberately unreachable: the pages must degrade, not 500.
          test "$(curl -s -o /dev/null -m 90 -w '%{http_code}' http://localhost:3888/)" = "200"
          echo "route smoke test passed"

      - name: Container logs
        if: always()
        run: docker logs wtla-ci 2>&1 | tail -40 || true

      - name: Stop
        if: always()
        run: docker rm -f wtla-ci || true

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
