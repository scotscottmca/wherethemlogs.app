name: Deploy app

# Runs when a PR lands on main and the change actually touches the application.
# Infrastructure has its own workflow; nothing here redeploys it.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "proxy.ts"
      - "next.config.mjs"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

# Both workflows run "az deployment group create" against the same resource
# group and the same template, so they share one concurrency group and queue
# instead of racing. Interleaved, deploy-infra can read the image that was
# running when it started and write it back after deploy-app has moved on,
# quietly reverting the application.
concurrency:
  group: azure-deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fail here rather than after pushing an image nobody can use.
      - name: Typecheck
        run: npm run typecheck

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the image
        id: image
        env:
          REGISTRY: ${{ vars.AZURE_REGISTRY_NAME }}
        run: |
          set -euo pipefail
          tag="${GITHUB_SHA::12}"
          server=$(az acr show --name "$REGISTRY" --query loginServer -o tsv)

          # ACR builds it, so the runner needs no Docker layer cache and the
          # image never crosses the public internet twice.
          az acr build \
            --registry "$REGISTRY" \
            --image "wtla:$tag" \
            --image "wtla:latest" \
            --file Dockerfile .

          echo "image=$server/wtla:$tag" >> "$GITHUB_OUTPUT"

      # The origin refuses anything that is not Cloudflare, so a stale list of
      # Cloudflare's ranges means some of its edges get a 403 from Azure and
      # some visitors get errors, intermittently. Compare before deploying.
      # An unreachable Cloudflare API warns rather than blocks: it cannot
      # confirm drift, so it should not stop a deploy.
      - name: Check Cloudflare's IP ranges are current
        run: |
          set -uo pipefail
          committed=$(jq -r '.parameters.allowedIngressCidrs.value[]?' infra/main.parameters.json | sort)
          if [ -z "$committed" ]; then echo "No ingress allowlist configured; nothing to check."; exit 0; fi
          if ! live=$(curl -fsS -m 20 https://api.cloudflare.com/client/v4/ips | jq -r '.result.ipv4_cidrs[]' | sort) || [ -z "$live" ]; then
            echo "::warning::Could not fetch Cloudflare's IP ranges; skipping the drift check."
            exit 0
          fi
          if [ "$live" != "$committed" ]; then
            echo "::error::Cloudflare's published IPv4 ranges no longer match allowedIngressCidrs in infra/main.parameters.json. Update the list, or some Cloudflare edges will be refused by the origin."
            diff <(echo "$committed") <(echo "$live") || true
            exit 1
          fi
          echo "Cloudflare ranges match ($(echo "$committed" | wc -l | tr -d ' ') entries)."

      - name: Roll out a new revision
        id: deploy
        # Through the environment, not pasted into the script: a JSON array's
        # quotes would end the shell string they were pasted into.
        env:
          AUTH_CLIENT_ID: ${{ vars.AUTH_CLIENT_ID }}
          AUTH_TENANT_ID: ${{ vars.AUTH_TENANT_ID }}
          DEVELOPER_PRINCIPAL_IDS: ${{ vars.DEVELOPER_PRINCIPAL_IDS || '[]' }}
          # The on-site request form. Unset leaves it off; see docs/DEPLOYMENT.md.
          REQUESTS_APP_ID: ${{ vars.REQUESTS_APP_ID }}
          REQUESTS_APP_PRIVATE_KEY: ${{ secrets.REQUESTS_APP_PRIVATE_KEY }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -euo pipefail

          # Deploying the template rather than "az containerapp update --image"
          # on purpose: the image is not the only thing that has to be right.
          # Ingress port, probes, env and identity all live in the template, and
          # an image-only update leaves them at whatever they were - which is
          # how ingress ended up pointed at a port nothing served.

          # The sign-in ids live in repository variables, not the parameters file.
          # Empty, the template would deploy with admin sign-in switched off.
          [ -n "$AUTH_CLIENT_ID" ] && [ -n "$AUTH_TENANT_ID" ] || {
            echo "::error::Set the AUTH_CLIENT_ID and AUTH_TENANT_ID repository variables (docs/DEPLOYMENT.md)."
            exit 1
          }

          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "app-$GITHUB_RUN_ID" \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters "authClientSecret=${{ secrets.AZURE_AAD_CLIENT_SECRET }}" \
            --parameters "authClientId=$AUTH_CLIENT_ID" \
            --parameters "authTenantId=$AUTH_TENANT_ID" \
            --parameters "developerPrincipalIds=$DEVELOPER_PRINCIPAL_IDS" \
            --parameters "requestsAppId=$REQUESTS_APP_ID" \
            --parameters "requestsAppPrivateKey=$REQUESTS_APP_PRIVATE_KEY" \
            --parameters "turnstileSiteKey=$TURNSTILE_SITE_KEY" \
            --parameters "turnstileSecretKey=$TURNSTILE_SECRET_KEY" \
            --parameters "containerImage=${{ steps.image.outputs.image }}" \
            --query properties.outputs -o json | tee outputs.json

          url=$(node -p "require('./outputs.json').publicUrl.value")
          origin=$(node -p "require('./outputs.json').siteUrl.value")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "Deployed \`${{ steps.image.outputs.image }}\` to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
          ORIGIN: ${{ steps.deploy.outputs.origin }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          # /api/live proves the revision is serving; /api/health proves it can
          # reach Cosmos. A failure of the second is a real deployment failure.
          for attempt in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" "$URL/api/health" || echo 000)
            if [ "$code" = "200" ]; then
              echo "healthy via $URL: $(cat /tmp/health.json)"
              # With a custom domain in front, the container's own address must
              # refuse this runner: that is the ingress allowlist doing its job.
              if [ "$URL" != "$ORIGIN" ] && [ -n "$ORIGIN" ]; then
                direct=$(curl -s -m 20 -o /dev/null -w "%{http_code}" "$ORIGIN/api/live" || echo 000)
                if [ "$direct" != "403" ]; then
                  echo "::error::$ORIGIN answered $direct directly. It should refuse anything that is not Cloudflare."
                  exit 1
                fi
                echo "origin locked: $ORIGIN refused this runner with 403"
              fi
              exit 0
            fi
            echo "attempt $attempt returned $code; the revision may still be starting"
            sleep 10
          done
          echo "::error::The new revision never returned a healthy /api/health."
          cat /tmp/health.json >&2 || true
          az containerapp revision list --name "$APP" --resource-group "$RG" \
            --query "[?properties.active].{name:name,healthState:properties.healthState,traffic:properties.trafficWeight}" -o table >&2 || true
          exit 1
