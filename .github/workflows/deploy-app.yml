name: Deploy app

# Runs when a PR lands on main and the change actually touches the application.
# Infrastructure has its own workflow; nothing here redeploys it.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "middleware.ts"
      - "next.config.mjs"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

# Both workflows run "az deployment group create" against the same resource
# group and the same template, so they share one concurrency group and queue
# instead of racing. Interleaved, deploy-infra can read the image that was
# running when it started and write it back after deploy-app has moved on,
# quietly reverting the application.
concurrency:
  group: azure-deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fail here rather than after pushing an image nobody can use.
      - name: Typecheck
        run: npm run typecheck

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the image
        id: image
        env:
          REGISTRY: ${{ vars.AZURE_REGISTRY_NAME }}
        run: |
          set -euo pipefail
          tag="${GITHUB_SHA::12}"
          server=$(az acr show --name "$REGISTRY" --query loginServer -o tsv)

          # ACR builds it, so the runner needs no Docker layer cache and the
          # image never crosses the public internet twice.
          az acr build \
            --registry "$REGISTRY" \
            --image "wtla:$tag" \
            --image "wtla:latest" \
            --file Dockerfile .

          echo "image=$server/wtla:$tag" >> "$GITHUB_OUTPUT"

      - name: Roll out a new revision
        id: deploy
        run: |
          set -euo pipefail

          # Deploying the template rather than "az containerapp update --image"
          # on purpose: the image is not the only thing that has to be right.
          # Ingress port, probes, env and identity all live in the template, and
          # an image-only update leaves them at whatever they were - which is
          # how ingress ended up pointed at a port nothing served.
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "app-$GITHUB_RUN_ID" \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters "containerImage=${{ steps.image.outputs.image }}" \
            --query properties.outputs -o json | tee outputs.json

          url=$(node -p "require('./outputs.json').siteUrl.value")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed \`${{ steps.image.outputs.image }}\` to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          # /api/live proves the revision is serving; /api/health proves it can
          # reach Cosmos. A failure of the second is a real deployment failure.
          for attempt in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" "$URL/api/health" || echo 000)
            if [ "$code" = "200" ]; then
              echo "healthy: $(cat /tmp/health.json)"
              exit 0
            fi
            echo "attempt $attempt returned $code; the revision may still be starting"
            sleep 10
          done
          echo "::error::The new revision never returned a healthy /api/health."
          cat /tmp/health.json >&2 || true
          az containerapp revision list --name "$APP" --resource-group "$RG" \
            --query "[?properties.active].{name:name,healthState:properties.healthState,traffic:properties.trafficWeight}" -o table >&2 || true
          exit 1
