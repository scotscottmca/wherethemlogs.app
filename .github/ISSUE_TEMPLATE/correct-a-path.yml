name: Correct a path
description: A path in the index is wrong, stale, or missing a variant
title: "Correction: "
labels: ["correction"]
body:
  - type: textarea
    id: app
    attributes:
      label: Application
      placeholder: Microsoft Teams
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: listed
    attributes:
      label: What the index currently says
      render: text
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What is wrong with it
      options:
        - The path is incorrect
        - The path moved in a newer version
        - The qualifiers are wrong (installer type, architecture or scope)
        - A variant is missing
        - The entry is a duplicate
        - Something else
    validations:
      required: true

  - type: textarea
    id: correct
    attributes:
      label: What it should say
      description: Verbatim, environment variables intact.
      render: text
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: How did you verify this?
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I have redacted hostnames, usernames, tenant identifiers and customer names.
          required: true
